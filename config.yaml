# ---------------------------------------------------------------------------
# sma campaign config (Shantanu Kumar, SDE internship outreach).
# Email copy lives in profile/templates/, the resume in profile/.
# ---------------------------------------------------------------------------

me:
  name: "Shantanu Kumar"
  # The account that sends (Google Workspace, App Password in .env / GitHub secret). Until 2026-10-08 the campaign sent
  # from shantanukumar.iitkgp@gmail.com to the HR PDF; that database is kept as data/leads_gmail_campaign.db.
  email: "shantanukumar@kgpian.iitkgp.ac.in"
  college: "IIT Kharagpur"

contacts:
  # The mailing database: every .xlsx / .csv in this folder (`sma import`, run on the laptop; the result is in the vault).
  folder: "E:/mail data/New folder"
  # Shared inboxes get "Hi {first_name}," wrong, so they are skipped on import.
  skip_role_addresses: true

limits:
  # Daily cap on NEW (touch 1) emails, by number of days that actually sent so far. Last value = steady state.
  # The reference agent's Workspace account was suspended for spam after ~900 cold sends in one day with
  # 11% bounces, so this new account ramps up to 500 over its first week instead of starting there.
  warmup: [100, 200, 300, 400, 500]
  hard_daily_total: 500             # touch 1 + follow-ups together, per day (follow-ups go first)
  # by email domain (Gmail, Yahoo etc. exempt); the lists hold 500+ people at KPMG, Deloitte, Zomato
  max_per_company_per_day: 10
  timezone: "Asia/Kolkata"
  send_window: { start: "10:00", end: "17:30" }
  send_days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
  # `sma run` is meant to be triggered every run_interval_minutes (Task Scheduler). Each run sends its share
  # of what is left of today's cap, so the day's mail is spread across the window instead of one burst.
  run_interval_minutes: 60
  max_per_run: 80
  gap_seconds: [20, 45]             # random pause between two sends; ~65 per hourly run fit in ~40 min
  # Auto-pause when bounces among the most recent first-touch sends reach this share (`sma resume` to continue).
  bounce_pause_threshold: 0.50
  bounce_window: 50
  bounce_min_sample: 20
  # Before a first email, skip the lead if its domain has no mail server (DNS MX/A). Catches dead domains,
  # not deleted mailboxes on a working domain.
  check_domains: true

sequence:
  # Day offsets of each touch from touch 1. Follow-ups go in the same thread; any reply stops the sequence.
  touch_days: [0, 4, 10]

# true = nothing is sent and the database is not changed: emails are written to outbox/ as .eml files.
# Turn off only after `sma check` passes and you have read a few files in outbox/.
dry_run: false

paths:
  db: "data/leads.db"
  suppression: "data/suppression.txt"   # one address (or @domain) per line; never mailed
  outbox: "outbox"
  templates: "profile/templates"
  resume: "profile/Shantanu_resume.pdf"   # attached to touch 1 only
