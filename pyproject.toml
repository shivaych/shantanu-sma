[project]
name = "sma"
version = "0.1.0"
description = "Shantanu's mass mail agent: SDE internship cold outreach to an HR contact list"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "tzdata>=2025.1",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
sma = "sma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
